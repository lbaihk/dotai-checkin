<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030A0C">

<title>AI Agent Builder 比賽｜延期舉行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    color: rgba(255,255,255,.92); font-family: "DM Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.6;
    background: #030A0C; background-image: radial-gradient(800px 500px at 85% -5%, rgba(0,219,182,.20), transparent 60%), linear-gradient(180deg, #030A0C 0%, #0B2F33 100%); }
  .box { max-width: 520px; width: 100%; text-align: center; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09); border-radius: 22px; padding: 32px 24px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; }
  .brand img { display: block; }
  .brand .lb { height: 20px; } .brand .dot { height: 19px; } .brand .x { color: rgba(255,255,255,.38); }
  .pill { display: inline-block; background: #FFE000; color: #000; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 4px; }
  h1 { font-size: 26px; margin: 14px 0 8px; color: #fff; }
  p { margin: 0 0 8px; color: rgba(255,255,255,.7); font-size: 15px; }
  .btn { display: inline-block; margin-top: 18px; background: #00DBB6; color: #000; font-weight: 700; text-decoration: none; padding: 13px 20px; border-radius: 12px; }
</style>
</head>
<body>
  <main class="box">
    <div class="brand">
      <img class="lb" src="lbai-logo.png" alt="LongbridgeAI"><span class="x">×</span><img class="dot" src="dotai-logo.png" alt="Dot.ai">
    </div>
    <span class="pill">延期舉行</span>
    <h1>AI Agent Builder 比賽</h1>
    <p>比賽將延期舉行，詳情及報名安排稍後公佈。</p>
    <p>每日打卡儲分換禮品照常進行，立即參加！</p>
    <a class="btn" href="./">前往每日打卡 →</a>
  </main>
</body>
</html>
